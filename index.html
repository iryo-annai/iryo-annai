<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>せき医療案内 | 関市 病院・診療所検索</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#20242b;
    --steel-900:#242a33;
    --steel-700:#3d4756;
    --steel-500:#66748a;
    --steel-300:#a9b4c4;
    --steel-100:#e7eaf0;
    --paper:#f4f2ee;
    --paper-2:#ffffff;
    --ember:#c65a2e;
    --ember-dark:#a3461f;
    --ember-soft:#f4dccb;
    --open-green:#2f7a52;
    --open-green-soft:#dcefe3;
    --closed-gray:#98a0ab;
    --line:#d8dbe1;
    --shadow: 0 8px 24px -12px rgba(32,36,43,0.25);
    --radius: 14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Zen Kaku Gothic New', -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Yu Gothic', sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}

  /* ---------- Header: forged blade motif ---------- */
  .hero{
    position:relative;
    background:linear-gradient(155deg, var(--ink) 0%, var(--steel-900) 45%, var(--steel-700) 100%);
    color:#f2efe9;
    padding:38px 20px 46px;
    overflow:hidden;
  }
  .hero::after{
    content:"";
    position:absolute;
    left:0; right:0; bottom:0;
    height:14px;
    background:
      linear-gradient(115deg, transparent 48%, var(--ember) 48.4%, var(--ember) 51.6%, transparent 52%),
      linear-gradient(65deg, transparent 48%, var(--ember-dark) 48.4%, var(--ember-dark) 51.6%, transparent 52%);
    background-size: 34px 100%, 34px 100%;
    background-position: 0 0, 17px 0;
    opacity:0.55;
  }
  .hero-inner{max-width:920px;margin:0 auto;position:relative;}
  .eyebrow{
    font-size:12.5px;
    letter-spacing:0.14em;
    color:var(--ember-soft);
    font-weight:700;
    display:flex;
    align-items:center;
    gap:8px;
    margin-bottom:10px;
  }
  .eyebrow .blade{
    width:22px;height:2px;background:var(--ember);
    position:relative;
  }
  .eyebrow .blade::after{
    content:"";
    position:absolute; right:-1px; top:-3px;
    width:0;height:0;
    border-top:4px solid transparent;
    border-bottom:4px solid transparent;
    border-left:6px solid var(--ember);
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-weight:700;
    font-size:clamp(28px,4.6vw,42px);
    margin:0 0 10px;
    letter-spacing:0.02em;
  }
  .hero p.lead{
    margin:0;
    color:var(--steel-300);
    font-size:15px;
    max-width:560px;
  }
  .clock-strip{
    margin-top:22px;
    display:inline-flex;
    align-items:center;
    gap:10px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.14);
    padding:8px 16px;
    border-radius:999px;
    font-size:13.5px;
    color:#f2efe9;
  }
  .clock-strip strong{font-variant-numeric:tabular-nums; font-weight:700;}
  .clock-dot{width:7px;height:7px;border-radius:50%;background:var(--ember);animation:pulse 2s infinite;}
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.35;}}
  .notice{
    margin:12px 0 0;
    font-size:12.5px;
    color:var(--ember-soft);
    background:rgba(198,90,46,0.16);
    border:1px solid rgba(198,90,46,0.35);
    display:inline-block;
    padding:7px 14px;
    border-radius:8px;
  }

  /* ---------- Controls ---------- */
  .wrap{max-width:920px;margin:0 auto;padding:0 20px;}
  .controls{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px;
    margin-top:-26px;
    position:relative;
    box-shadow:var(--shadow);
    display:grid;
    gap:14px;
  }
  .search-row{display:flex; gap:10px;}
  .search-row input[type="text"]{
    flex:1;
    padding:12px 14px;
    border:1.5px solid var(--line);
    border-radius:10px;
    font-size:15px;
    font-family:inherit;
    background:var(--paper);
    color:var(--ink);
  }
  .search-row input[type="text"]:focus{outline:2px solid var(--ember); outline-offset:1px; border-color:var(--ember);}
  .filter-row{
    display:flex;
    flex-wrap:wrap;
    gap:10px;
    align-items:center;
  }
  select{
    padding:10px 12px;
    border:1.5px solid var(--line);
    border-radius:10px;
    background:var(--paper) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M0 0 L5 6 L10 0" fill="none" stroke="%2366748a" stroke-width="1.6"/></svg>') no-repeat right 12px center;
    appearance:none;
    -webkit-appearance:none;
    font-family:inherit;
    font-size:14px;
    color:var(--ink);
    min-width:150px;
    cursor:pointer;
  }
  select:focus{outline:2px solid var(--ember);}
  .seg{
    display:inline-flex;
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:10px;
    overflow:hidden;
  }
  .seg button{
    border:none;
    background:transparent;
    padding:9px 14px;
    font-family:inherit;
    font-size:13.5px;
    font-weight:500;
    color:var(--steel-500);
    cursor:pointer;
    transition:background .15s, color .15s;
    white-space:nowrap;
  }
  .seg button + button{border-left:1.5px solid var(--line);}
  .seg button.active{background:var(--steel-900); color:#fff;}
  .result-count{
    margin-left:auto;
    font-size:13px;
    color:var(--steel-500);
    font-weight:500;
  }

  /* ---------- List ---------- */
  .list{max-width:920px;margin:22px auto 60px; padding:0 20px; display:grid; gap:14px;}
  .card{
    background:var(--paper-2);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:18px 18px 16px;
    transition:box-shadow .15s, transform .15s;
  }
  .card:hover{box-shadow:var(--shadow);}
  .card-top{display:flex; justify-content:space-between; align-items:flex-start; gap:12px;}
  .card-name{
    font-size:17px;
    font-weight:700;
    margin:0 0 4px;
    letter-spacing:0.01em;
  }
  .kind-tag{
    display:inline-block;
    font-size:11px;
    font-weight:700;
    padding:2px 8px;
    border-radius:5px;
    margin-right:7px;
    letter-spacing:0.03em;
    vertical-align:middle;
    position:relative;
    top:-1px;
  }
  .kind-tag.hospital{background:var(--steel-100); color:var(--steel-700);}
  .kind-tag.clinic{background:#eef1f5; color:var(--steel-500);}
  .card-addr{font-size:13.5px; color:var(--steel-500); margin:0 0 2px;}
  .card-links{font-size:13px; margin-top:4px; display:flex; gap:14px; flex-wrap:wrap;}
  .card-links a{color:var(--ember-dark); text-decoration:none; font-weight:500;}
  .card-links a:hover{text-decoration:underline;}

  .status-badge{
    flex:none;
    font-size:12.5px;
    font-weight:700;
    padding:6px 12px;
    border-radius:999px;
    white-space:nowrap;
    display:inline-flex;
    align-items:center;
    gap:6px;
  }
  .status-badge .dot{width:7px;height:7px;border-radius:50%;}
  .status-badge.open{background:var(--open-green-soft); color:var(--open-green);}
  .status-badge.open .dot{background:var(--open-green);}
  .status-badge.closed{background:#eef0f2; color:var(--closed-gray);}
  .status-badge.closed .dot{background:var(--closed-gray);}

  .dept-chips{display:flex; flex-wrap:wrap; gap:7px; margin-top:12px;}
  .chip{
    font-size:12.5px;
    padding:6px 11px;
    border-radius:8px;
    background:var(--paper);
    border:1px solid var(--line);
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:6px;
    color:var(--steel-700);
    font-family:inherit;
    transition:background .12s, border-color .12s;
  }
  .chip:hover{border-color:var(--steel-300);}
  .chip.active{background:var(--steel-900); color:#fff; border-color:var(--steel-900);}
  .chip .dot{width:6px;height:6px;border-radius:50%;background:var(--open-green); flex:none;}
  .chip .dot.off{background:var(--closed-gray);}
  .chip.active .dot{background:#8be0af;}
  .chip.active .dot.off{background:#9aa4b3;}
  .chip.match{outline:1.5px solid var(--ember); outline-offset:0;}

  .schedule{
    margin-top:12px;
    border-top:1px dashed var(--line);
    padding-top:12px;
    font-size:13px;
  }
  .schedule table{width:100%; border-collapse:collapse;}
  .schedule th, .schedule td{
    text-align:center;
    padding:6px 3px;
    font-size:12.5px;
    color:var(--steel-700);
  }
  .schedule th{color:var(--steel-500); font-weight:600; font-size:11.5px;}
  .schedule td.today{background:var(--ember-soft); border-radius:6px; font-weight:700; color:var(--ember-dark);}
  .schedule .blockline{display:block; white-space:nowrap;}

  .empty{
    text-align:center;
    padding:60px 20px;
    color:var(--steel-500);
  }
  .empty .big{font-size:34px; margin-bottom:10px;}

  footer{
    max-width:920px;margin:0 auto;padding:20px 20px 50px;
    font-size:12px; color:var(--steel-500); border-top:1px solid var(--line);
  }
  footer a{color:var(--steel-500);}

  @media (max-width:600px){
    .hero{padding:30px 16px 40px;}
    .controls{padding:14px;}
    .filter-row{gap:8px;}
    select{min-width:0; flex:1;}
    .result-count{width:100%; margin-left:0; order:99;}
    .card-top{flex-direction:column;}
    .status-badge{align-self:flex-start;}
  }
</style>
</head>
<body>

<div class="hero">
  <div class="hero-inner">
    <div class="eyebrow"><span class="blade"></span>SEKI CITY MEDICAL GUIDE</div>
    <h1>せき医療案内</h1>
    <p class="lead">刃物のまち・関市の病院とクリニックを、診療科と「今すぐ診てもらえるか」で探せます。厚生労働省オープンデータ（医療情報ネット）をもとに作成。</p>
    <div class="clock-strip"><span class="clock-dot"></span>本日 <strong id="todayLabel">-</strong> ・ 現在時刻 <strong id="clockLabel">--:--</strong></div>
    <p class="notice">※臨時休業・診療時間の変更など最新の状況は、必ず各医療機関に直接ご確認ください。</p>
  </div>
</div>

<div class="wrap">
  <div class="controls">
    <div class="search-row">
      <input type="text" id="searchInput" placeholder="病院名・クリニック名・住所で検索（例: 内科、山田、〇〇クリニック）">
    </div>
    <div class="filter-row">
      <select id="deptSelect"><option value="">すべての診療科</option></select>
      <div class="seg" id="kindSeg">
        <button data-kind="" class="active">すべて</button>
        <button data-kind="hospital">病院</button>
        <button data-kind="clinic">診療所</button>
      </div>
      <div class="seg" id="sortSeg">
        <button data-sort="name" class="active">名前順</button>
        <button data-sort="open">営業中を先に</button>
      </div>
      <span class="result-count" id="resultCount"></span>
    </div>
  </div>
</div>

<div class="list" id="list"></div>

<footer>
  データ出典：厚生労働省「医療情報ネット（ナビイ）」オープンデータ（2026年6月1日時点、病院・診療所）／公共データ利用規約(PDL1.0)。診療時間・診療科は各施設からの報告時点の情報のため、受診前に必ず各施設へご確認ください。
</footer>

const DAY_KEYS = ['日','月','火','水','木','金','土']; // index = JS getDay()
const DAY_LABELS_ROW = ['月','火','水','木','金','土','日'];

function timeToMin(t){
  const [h,m] = t.split(':').map(Number);
  return h*60+m;
}

function now(){ return new Date(); }

function todayKey(d){ return DAY_KEYS[d.getDay()]; }

function isBlockOpenToday(block, dayKey, nowMin){
  const range = block[dayKey];
  if(!range) return false;
  const start = timeToMin(range[0]);
  const end = timeToMin(range[1]);
  return nowMin >= start && nowMin <= end;
}

function deptIsOpen(dept, dayKey, nowMin){
  return dept.blocks.some(b => isBlockOpenToday(b, dayKey, nowMin));
}

function facilityIsOpen(fac, dayKey, nowMin){
  return fac.departments.some(d => deptIsOpen(d, dayKey, nowMin));
}

function deptHasDataToday(dept, dayKey){
  return dept.blocks.some(b => b[dayKey]);
}

// ---------- Build department filter options ----------
const allDepts = Array.from(new Set(DATA.flatMap(f => f.departments.map(d => d.dept)))).sort((a,b)=>a.localeCompare(b,'ja'));
const deptSelect = document.getElementById('deptSelect');
allDepts.forEach(d=>{
  const opt = document.createElement('option');
  opt.value = d; opt.textContent = d;
  deptSelect.appendChild(opt);
});

// ---------- State ----------
let state = { q:'', dept:'', kind:'', sort:'name', expandedChip:{} };

function mapsUrl(fac){
  if(fac.lat && fac.lng) return `https://www.google.com/maps/search/?api=1&query=${fac.lat},${fac.lng}`;
  return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(fac.address)}`;
}

function scheduleTableHTML(dept, dayKey){
  // merge blocks per day into display strings
  const perDay = {};
  DAY_LABELS_ROW.forEach(d=>perDay[d]=[]);
  dept.blocks.forEach(b=>{
    DAY_LABELS_ROW.forEach(d=>{
      if(b[d]) perDay[d].push(`${b[d][0]}–${b[d][1]}`);
    });
  });
  let html = '<table><thead><tr>' + DAY_LABELS_ROW.map(d=>`<th class="${d===dayKey?'today':''}">${d}</th>`).join('') + '</tr></thead><tbody><tr>';
  html += DAY_LABELS_ROW.map(d=>{
    const cell = perDay[d].length ? perDay[d].map(s=>`<span class="blockline">${s}</span>`).join('') : '<span class="blockline" style="color:#c3c9d1">休診</span>';
    return `<td class="${d===dayKey?'today':''}">${cell}</td>`;
  }).join('');
  html += '</tr></tbody></table>';
  return html;
}

function render(){
  const d = now();
  const dayKey = todayKey(d);
  const nowMin = d.getHours()*60 + d.getMinutes();

  document.getElementById('todayLabel').textContent = dayKey + '曜日';
  document.getElementById('clockLabel').textContent =
    String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');

  let items = DATA.map(fac => ({
    fac,
    open: facilityIsOpen(fac, dayKey, nowMin)
  }));

  if(state.kind) items = items.filter(x=>x.fac.kind===state.kind);

  if(state.dept) items = items.filter(x=>x.fac.departments.some(d=>d.dept===state.dept));

  if(state.q){
    const q = state.q.toLowerCase();
    items = items.filter(x =>
      x.fac.name.toLowerCase().includes(q) ||
      x.fac.address.toLowerCase().includes(q) ||
      x.fac.departments.some(d=>d.dept.toLowerCase().includes(q))
    );
  }

  if(state.sort === 'open'){
    items.sort((a,b)=> (b.open - a.open) || a.fac.name.localeCompare(b.fac.name,'ja'));
  } else {
    items.sort((a,b)=> a.fac.name.localeCompare(b.fac.name,'ja'));
  }

  document.getElementById('resultCount').textContent = `${items.length} 件`;

  const list = document.getElementById('list');
  if(items.length === 0){
    list.innerHTML = `<div class="empty"><div class="big">🔍</div>条件に合う医療機関が見つかりませんでした。<br>検索条件を変えてみてください。</div>`;
    return;
  }

  list.innerHTML = items.map(({fac, open}) => {
    const kindLabel = fac.kind === 'hospital' ? '病院' : '診療所';
    const deptChips = fac.departments.map(dept=>{
      const dOpen = deptIsOpen(dept, dayKey, nowMin);
      const hasToday = deptHasDataToday(dept, dayKey);
      const isMatch = state.dept && dept.dept === state.dept;
      const key = fac.id + '__' + dept.dept;
      const expanded = !!state.expandedChip[key];
      return {
        html: `<button class="chip ${expanded?'active':''} ${isMatch?'match':''}" data-key="${key}">
                 <span class="dot ${hasToday && dOpen ? '' : 'off'}"></span>${dept.dept}
               </button>`,
        expanded, dept
      };
    });

    const expandedBlocks = deptChips.filter(c=>c.expanded).map(c=>`
      <div class="schedule">
        <div style="font-weight:700;font-size:12.5px;margin-bottom:6px;color:var(--steel-700)">${c.dept.dept} の診療時間</div>
        ${scheduleTableHTML(c.dept, dayKey)}
      </div>`).join('');

    return `
    <div class="card">
      <div class="card-top">
        <div>
          <p class="card-name"><span class="kind-tag ${fac.kind}">${kindLabel}</span>${fac.name}</p>
          <p class="card-addr">${fac.address}</p>
          <div class="card-links">
            <a href="${mapsUrl(fac)}" target="_blank" rel="noopener">地図で見る</a>
            ${fac.url ? `<a href="${fac.url}" target="_blank" rel="noopener">公式サイト</a>` : ''}
          </div>
        </div>
        <span class="status-badge ${open?'open':'closed'}"><span class="dot"></span>${open ? '診療時間内' : '診療時間外'}</span>
      </div>
      <div class="dept-chips">${deptChips.map(c=>c.html).join('')}</div>
      ${expandedBlocks}
    </div>`;
  }).join('');

  // wire up chip clicks
  list.querySelectorAll('.chip').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.getAttribute('data-key');
      state.expandedChip[key] = !state.expandedChip[key];
      render();
    });
  });
}

document.getElementById('searchInput').addEventListener('input', e=>{
  state.q = e.target.value; render();
});
document.getElementById('deptSelect').addEventListener('change', e=>{
  state.dept = e.target.value; render();
});
document.getElementById('kindSeg').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  document.querySelectorAll('#kindSeg button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  state.kind = btn.getAttribute('data-kind'); render();
});
document.getElementById('sortSeg').addEventListener('click', e=>{
  const btn = e.target.closest('button'); if(!btn) return;
  document.querySelectorAll('#sortSeg button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  state.sort = btn.getAttribute('data-sort'); render();
});

render();
setInterval(render, 30000); // keep open/closed + clock fresh
</script>
</body>
</html>
